version: 2
updates:
# Enable version updates for .NET dependencies
- package-ecosystem: "nuget"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
    time: "06:00"
  open-pull-requests-limit: 10
  reviewers:
  - "marci"
  assignees:
  - "marci"
  commit-message:
    prefix: "chore"
    include: "scope"
  labels:
  - "dependencies"
  - "nuget"

# Enable version updates for GitHub Actions
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
    time: "06:00"
  open-pull-requests-limit: 5
  reviewers:
  - "marci"
  assignees:
  - "marci"
  commit-message:
    prefix: "ci"
    include: "scope"
  labels:
  - "dependencies"
  - "github-actions"
